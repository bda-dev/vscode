<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória – O Escolhido</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0a00 0%, #3d1f00 50%, #1a0a00 100%);
    font-family: 'Georgia', serif;
    color: #f5e6c8;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    padding: 24px 16px 12px;
  }

  header h1 {
    font-size: 2rem;
    color: #f0c040;
    text-shadow: 0 2px 8px #000a;
    letter-spacing: 2px;
  }

  header p {
    font-size: 0.95rem;
    color: #c9a96e;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 12px 16px;
  }

  .btn {
    padding: 10px 22px;
    border: 2px solid #c9a96e;
    border-radius: 8px;
    background: transparent;
    color: #f5e6c8;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    cursor: pointer;
    transition: all .2s;
  }

  .btn:hover { background: #c9a96e22; }
  .btn.active { background: #c9a96e; color: #1a0a00; font-weight: bold; }

  .stats {
    display: flex;
    gap: 32px;
    padding: 8px 16px;
    font-size: 1rem;
    color: #f0c040;
  }

  .stats span { display: flex; align-items: center; gap: 6px; }

  #board {
    display: grid;
    gap: 10px;
    padding: 16px;
    max-width: 900px;
    width: 100%;
  }

  .card {
    aspect-ratio: 3/4;
    cursor: pointer;
    perspective: 800px;
    user-select: none;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.4,0,.2,1);
    border-radius: 12px;
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
  }

  .card-front {
    background: linear-gradient(145deg, #2c1505, #5a3010);
    border: 2px solid #7a5020;
    box-shadow: 0 4px 12px #0006;
  }

  .card-front::before {
    content: '✦';
    font-size: 2.5rem;
    color: #c9a96e44;
    position: absolute;
  }

  .card-front .mark {
    font-size: 2rem;
    color: #f0c040;
    position: relative;
    z-index: 1;
  }

  .card-back {
    background: linear-gradient(145deg, #3a1800, #6b3010);
    border: 2px solid #f0c040;
    transform: rotateY(180deg);
    box-shadow: 0 4px 12px #0006;
    gap: 6px;
  }

  .card.matched .card-back {
    border-color: #70d070;
    background: linear-gradient(145deg, #0a2a0a, #1a4a1a);
    box-shadow: 0 0 16px #70d07066;
  }

  .card-emoji { font-size: 2rem; }

  .card-name {
    font-size: 0.78rem;
    font-weight: bold;
    color: #f0c040;
    line-height: 1.2;
  }

  .card-desc {
    font-size: 0.6rem;
    color: #c9a96e;
    line-height: 1.3;
  }

  .card-group {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 0.5rem;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .group-discipulo { background: #1e4a8a; color: #a0c4ff; }
  .group-mulher    { background: #7a1a4a; color: #ffb0d8; }
  .group-lider     { background: #4a3a00; color: #ffd060; }
  .group-romano    { background: #2a0a0a; color: #ff9090; }

  /* Win overlay */
  #win-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #000c;
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }

  #win-screen.show { display: flex; }

  .win-box {
    background: linear-gradient(145deg, #2c1505, #5a3010);
    border: 3px solid #f0c040;
    border-radius: 20px;
    padding: 40px 48px;
    max-width: 440px;
    width: 90%;
    box-shadow: 0 8px 40px #0008;
  }

  .win-box h2 { font-size: 2rem; color: #f0c040; margin-bottom: 8px; }
  .win-box p  { font-size: 1rem; color: #c9a96e; margin-bottom: 16px; }

  .win-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }

  .win-stat {
    background: #0004;
    border-radius: 10px;
    padding: 12px;
  }

  .win-stat .val { font-size: 1.8rem; color: #f0c040; font-weight: bold; }
  .win-stat .lbl { font-size: 0.75rem; color: #c9a96e; }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    opacity: 0;
    animation: confetti-fall 3s ease-in forwards;
    z-index: 200;
    pointer-events: none;
  }

  @keyframes confetti-fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Responsive grid columns set by JS */
  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .stats { gap: 16px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <h1>✦ O Escolhido ✦</h1>
  <p>Jogo da Memória dos Personagens</p>
</header>

<div class="controls">
  <button class="btn active" id="btn-facil"   onclick="setDifficulty('facil')">Fácil (4×3)</button>
  <button class="btn"        id="btn-medio"   onclick="setDifficulty('medio')">Médio (4×4)</button>
  <button class="btn"        id="btn-dificil" onclick="setDifficulty('dificil')">Difícil (6×6)</button>
  <button class="btn"        onclick="startGame()">↺ Reiniciar</button>
</div>

<div class="stats">
  <span>🎴 Movimentos: <strong id="moves">0</strong></span>
  <span>✅ Pares: <strong id="pairs">0</strong>/<strong id="total-pairs">6</strong></span>
  <span>⏱️ <strong id="timer">0:00</strong></span>
</div>

<div id="board"></div>

<div id="win-screen">
  <div class="win-box">
    <h2>🎉 Parabéns!</h2>
    <p>Você encontrou todos os pares!</p>
    <div class="win-stats">
      <div class="win-stat"><div class="val" id="w-moves">0</div><div class="lbl">Movimentos</div></div>
      <div class="win-stat"><div class="val" id="w-time">0:00</div><div class="lbl">Tempo</div></div>
      <div class="win-stat"><div class="val" id="w-level">-</div><div class="lbl">Nível</div></div>
      <div class="win-stat"><div class="val" id="w-score">0</div><div class="lbl">Pontuação</div></div>
    </div>
    <button class="btn active" onclick="startGame()">Jogar Novamente</button>
  </div>
</div>

<script>
const CHARACTERS = [
  { name: 'Jesus',          emoji: '✝️',  desc: 'O Filho de Deus',          group: 'discipulo' },
  { name: 'Simão Pedro',    emoji: '⚓',  desc: 'Pescador e apóstolo',       group: 'discipulo' },
  { name: 'Maria Madalena', emoji: '🌺',  desc: 'Libertada por Jesus',       group: 'mulher'    },
  { name: 'André',          emoji: '🎣',  desc: 'Irmão de Simão Pedro',      group: 'discipulo' },
  { name: 'Mateus (Levi)',  emoji: '📜',  desc: 'Cobrador de impostos',      group: 'discipulo' },
  { name: 'João',           emoji: '🕊️', desc: 'O discípulo amado',         group: 'discipulo' },
  { name: 'Tiago',          emoji: '⚡',  desc: 'Filho de Zebedeu',          group: 'discipulo' },
  { name: 'Nicodemos',      emoji: '📖',  desc: 'Fariseu que buscou Jesus',  group: 'lider'     },
  { name: 'Maria',          emoji: '💙',  desc: 'Mãe de Jesus',              group: 'mulher'    },
  { name: 'Tomé',           emoji: '🤔',  desc: 'O que duvidou',             group: 'discipulo' },
  { name: 'Filipe',         emoji: '🌾',  desc: 'Chamado na Galileia',       group: 'discipulo' },
  { name: 'Natanael',       emoji: '🌳',  desc: 'Sem malícia em si',         group: 'discipulo' },
  { name: 'Judas',          emoji: '💰',  desc: 'O traidor dos doze',        group: 'discipulo' },
  { name: 'Eden',           emoji: '🏠',  desc: 'Esposa de Simão Pedro',     group: 'mulher'    },
  { name: 'Gaius',          emoji: '⚔️', desc: 'Centurião romano',           group: 'romano'    },
  { name: 'Shmuel',         emoji: '📿',  desc: 'Fariseu rival de Nicodemos',group: 'lider'     },
  { name: 'Tadeu',          emoji: '🙏',  desc: 'Discípulo fiel e quieto',   group: 'discipulo' },
  { name: 'Simão Zelote',   emoji: '🗡️', desc: 'Ex-revolucionário',          group: 'discipulo' },
];

const DIFFICULTY = {
  facil:   { cols: 4, rows: 3, pairs: 6  },
  medio:   { cols: 4, rows: 4, pairs: 8  },
  dificil: { cols: 6, rows: 6, pairs: 18 },
};

let currentDifficulty = 'facil';
let flipped = [], matched = 0, moves = 0, locked = false;
let timerInterval = null, seconds = 0;

function setDifficulty(d) {
  currentDifficulty = d;
  document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + d).classList.add('active');
  startGame();
}

function startGame() {
  clearInterval(timerInterval);
  seconds = 0; moves = 0; matched = 0; flipped = []; locked = false;
  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('win-screen').classList.remove('show');

  const cfg = DIFFICULTY[currentDifficulty];
  const needed = cfg.pairs;
  document.getElementById('pairs').textContent = '0';
  document.getElementById('total-pairs').textContent = needed;

  const chars = shuffle([...CHARACTERS]).slice(0, needed);
  const cards = shuffle([...chars, ...chars].map((c, i) => ({ ...c, id: i })));

  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
  board.innerHTML = '';

  cards.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = c.name;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front"><span class="mark">?</span></div>
        <div class="card-face card-back">
          <span class="card-emoji">${c.emoji}</span>
          <span class="card-name">${c.name}</span>
          <span class="card-desc">${c.desc}</span>
          <span class="card-group group-${c.group}">${groupLabel(c.group)}</span>
        </div>
      </div>`;
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
  });

  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function groupLabel(g) {
  return { discipulo: 'Discípulo', mulher: 'Mulher', lider: 'Líder', romano: 'Romano' }[g] || g;
}

function flipCard(card) {
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flipped.push(card);
  if (flipped.length === 2) checkMatch();
}

function checkMatch() {
  locked = true;
  moves++;
  document.getElementById('moves').textContent = moves;

  const [a, b] = flipped;
  if (a.dataset.name === b.dataset.name) {
    a.classList.add('matched'); b.classList.add('matched');
    matched++;
    document.getElementById('pairs').textContent = matched;
    flipped = []; locked = false;
    if (matched === DIFFICULTY[currentDifficulty].pairs) setTimeout(winGame, 400);
  } else {
    setTimeout(() => {
      a.classList.remove('flipped'); b.classList.remove('flipped');
      flipped = []; locked = false;
    }, 900);
  }
}

function winGame() {
  clearInterval(timerInterval);
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  const timeStr = `${m}:${s.toString().padStart(2,'0')}`;
  const levelNames = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' };
  const score = Math.max(0, 1000 - moves * 10 - seconds * 2);

  document.getElementById('w-moves').textContent = moves;
  document.getElementById('w-time').textContent = timeStr;
  document.getElementById('w-level').textContent = levelNames[currentDifficulty];
  document.getElementById('w-score').textContent = score;
  document.getElementById('win-screen').classList.add('show');

  launchConfetti();
}

function launchConfetti() {
  const colors = ['#f0c040','#70d070','#4090ff','#ff6090','#c9a96e'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-20px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      el.style.width  = (8 + Math.random() * 8) + 'px';
      el.style.height = (8 + Math.random() * 8) + 'px';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 40);
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

startGame();
</script>
</body>
</html>
